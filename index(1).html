<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DKR American Shop</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);width:360px;text-align:center}
h1{color:#c62828} .digits{display:flex;gap:10px;justify-content:center;margin:20px 0}
.digits input{width:55px;height:55px;font-size:28px;text-align:center}
button{width:100%;padding:14px;border:none;background:#c62828;color:#fff;border-radius:10px;font-size:16px;cursor:pointer}
#shop{display:none;text-align:left;margin-top:20px}
.item{display:flex;justify-content:space-between;margin:8px 0;padding:8px;background:#fafafa;border-radius:8px}
</style></head>
<body>
<div class="card">
<h1>🍬 DKR American Shop</h1>
<p>Entrez votre code à 4 chiffres</p>
<div class="digits">
<input maxlength=1><input maxlength=1><input maxlength=1><input maxlength=1>
</div>
<button onclick="login()">Accéder</button>
<p id="msg"></p>
<div id="shop">
<h2>Boutique</h2>
<div class="item"><span>🍭 Chupa Chups</span><strong>500 FCFA</strong></div>
<div class="item"><span>🍫 Snickers</span><strong>800 FCFA</strong></div>
<div class="item"><span>🍬 M&M's</span><strong>1200 FCFA</strong></div>
<hr>
<p><strong>Prototype :</strong> dans la version finale, cette page mènera au panier et au paiement.</p>
</div>
</div>
<script>
const ins=[...document.querySelectorAll('input')];
ins.forEach((e,i)=>{
e.oninput=()=>{if(e.value&&i<3)ins[i+1].focus()}
});
function login(){
const code=ins.map(i=>i.value).join('');
const m=document.getElementById('msg');
if(code==='1234'){
m.style.color='green';m.textContent='Code valide.';
document.getElementById('shop').style.display='block';
}else{
m.style.color='red';m.textContent='Code invalide. Utilisez 1234 pour le prototype.';
}
}
</script>
</body></html>
